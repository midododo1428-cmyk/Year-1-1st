<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spark Academy – Year 1 Premium Interactive Quiz</title>
<style>
:root{--p:#4b158f;--p2:#7c39c5;--g:#f5b400;--ink:#17132d;--muted:#6d6680;--line:#e4d8f2;--ok:#178b4d;--bad:#cb3e5e}
*{box-sizing:border-box} body{margin:0;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 5%,rgba(255,212,80,.18),transparent 26rem),radial-gradient(circle at 92% 10%,rgba(110,47,181,.11),transparent 28rem),#fff}
button,input{font:inherit}button{cursor:pointer}
.app{max-width:1120px;margin:auto;padding:16px}
.head{display:grid;grid-template-columns:280px 1fr 235px;gap:14px;align-items:center}
.head img{width:100%;object-fit:contain} .logo{max-height:185px} .mascot{max-height:185px}
.title{text-align:center}.title h1{margin:0;color:var(--p);font-size:clamp(2rem,4.5vw,3.5rem);line-height:1}.title p{margin:.55rem 0 0;color:var(--muted);font-weight:900;font-size:1.2rem}
.panel{background:rgba(255,255,255,.98);border:2px solid rgba(75,21,143,.13);border-radius:28px;box-shadow:0 14px 40px rgba(57,24,91,.09);padding:clamp(18px,4vw,32px)}
.start{max-width:760px;margin:20px auto;text-align:center} .bigstar{font-size:3rem} .start h2{font-size:2.25rem;margin:.2rem 0 .6rem}.start p{color:var(--muted);line-height:1.55;font-weight:700}
.startrow{display:flex;gap:12px;max-width:590px;margin:22px auto 0}.startrow input{flex:1;min-width:0;border:2px solid #d7c7e9;border-radius:16px;padding:14px 16px;font-size:17px;outline:none}.startrow input:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(75,21,143,.08)}
.primary{border:0;border-radius:15px;padding:14px 22px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:900;box-shadow:0 8px 18px rgba(75,21,143,.2)}
.quiz,.result{display:none} .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.pill{background:#f4eefb;color:var(--p);font-weight:900;border-radius:999px;padding:9px 14px}.score{font-weight:900;color:#956800}
.progress{height:12px;background:#eee7f6;border-radius:999px;overflow:hidden;margin:12px 0 20px}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--p));transition:width .25s}
.mode{font-size:.84rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--p)}.question{font-size:clamp(1.55rem,3vw,2.25rem);font-weight:900;margin:.55rem 0 1.1rem}
.options{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.option{min-height:220px;border:3px solid var(--line);border-radius:24px;background:#fff;padding:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:.15s}
.option:hover{transform:translateY(-2px);border-color:#b9a0d7}.option img{width:100%;height:190px;object-fit:contain;display:block}
.option.correct{border-color:#32a565;background:#eefbf3}.option.wrong{border-color:#d55c76;background:#fff0f4;animation:shake .25s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.feedback{min-height:32px;margin-top:12px;font-weight:900}.good{color:var(--ok)}.bad{color:var(--bad)}.flash{display:none;text-align:center;margin-top:6px}.flash.show{display:block}.flash img{width:min(320px,80%);max-height:220px;object-fit:contain}
.builder{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:center}.scene{border:2px solid #ece2f6;border-radius:22px;background:#fff;padding:10px;min-height:250px;display:flex;align-items:center;justify-content:center}.scene img{width:100%;height:230px;object-fit:contain;object-position:center}
.answer{min-height:78px;border:3px dashed #c9b3e1;border-radius:18px;background:#fbf8ff;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.answer.empty:before{content:"Tap the words to build the sentence";color:#968ca6;font-weight:800}
.tiles{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.tile{border:2px solid #d7c7e8;background:#fff;border-radius:14px;padding:11px 14px;font-weight:900}.tile:disabled{opacity:.35}.chip{border:2px solid #efc44d;background:#fff4c4;border-radius:13px;padding:10px 13px;font-weight:900;cursor:pointer}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.secondary{border:2px solid #dacbea;background:#fff;color:var(--p);border-radius:14px;padding:10px 15px;font-weight:900}
.footer{text-align:center;margin-top:18px}.footer img{width:min(430px,90%);object-fit:contain}.result{text-align:center}.result h2{font-size:2.5rem;color:var(--p);margin:.3rem 0}.final{font-size:1.45rem;font-weight:900;margin:10px 0}
@media(max-width:760px){.app{padding:10px}.head{grid-template-columns:120px 1fr 105px;gap:6px}.logo{max-height:100px}.mascot{max-height:100px}.title h1{font-size:1.55rem}.title p{font-size:.88rem}.panel{padding:15px;border-radius:20px}.startrow{flex-direction:column}.options{gap:9px}.option{min-height:140px;padding:6px}.option img{height:115px}.builder{grid-template-columns:1fr}.scene{min-height:190px}.scene img{height:170px}}
</style>
</head>

const EXAM_ID="Y1-READ-MATCH-BUILD-01";
const EXAM_TITLE="Year 1 Read • Match • Build Sentences";
let qs=[],i=0,stars=0,student="",built=[],locked=false;
let wrongAttempts=0,firstTryCorrect=0,questionHadMistake=false,resultsSent=false,mistakeLog=[];
const $=id=>document.getElementById(id);
function sh(a){a=a.slice();for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function start(){student=$("name").value.trim();if(!student){$("nameErr").textContent="Please type the student name first.";return}$("nameErr").textContent="";qs=[...DATA.matching.map(q=>({...q,type:"m"})),...DATA.build.map(q=>({...q,type:"b"}))];i=0;stars=0;wrongAttempts=0;firstTryCorrect=0;questionHadMistake=false;resultsSent=false;mistakeLog=[];$("start").style.display="none";$("quiz").style.display="block";$("result").style.display="none";render()}
function render(){locked=false;built=[];questionHadMistake=false;$("feedback").textContent="";$("feedback").className="feedback";$("flash").classList.remove("show");$("qnum").textContent=`Question ${i+1} / ${qs.length}`;$("stars").textContent=`⭐ ${stars}`;$("bar").style.width=`${(i/qs.length)*100}%`;qs[i].type==="m"?renderM(qs[i]):renderB(qs[i])}
function recordMistake(q,answerGiven){wrongAttempts++;if(!questionHadMistake){questionHadMistake=true;mistakeLog.push({question:i+1,type:q.type==="m"?"Read & Match":"Build a Sentence",prompt:q.sentence||"Put the words in the correct order.",studentAnswer:answerGiven||"Incorrect attempt",correctAnswer:q.answer});}}
function renderM(q){$("mode").textContent="Part 1 • Read & Match";$("question").textContent=q.sentence;const keys=Object.keys(DATA.images),choices=sh([q.answer,...sh(keys.filter(x=>x!==q.answer)).slice(0,3)]);$("area").innerHTML='<div class="options">'+choices.map(k=>`<button class="option" data-k="${k}"><img src="${DATA.images[k]}" alt="Picture option"></button>`).join("")+'</div>';document.querySelectorAll(".option").forEach(b=>b.onclick=()=>{if(locked)return;if(b.dataset.k===q.answer){locked=true;b.classList.add("correct");right()}else{recordMistake(q,b.dataset.k);b.classList.add("wrong");$("feedback").textContent="Try again — read carefully. 💜";$("feedback").className="feedback bad";setTimeout(()=>b.classList.remove("wrong"),350)}})}
function renderB(q){$("mode").textContent="Part 2 • Build a Sentence";$("question").textContent="Put the words in the correct order.";$("area").innerHTML=`<div class="builder"><div class="scene"><img src="${q.image}" alt="Sentence picture"></div><div><div id="answer" class="answer empty"></div><div class="tiles">${sh(q.words).map(w=>`<button class="tile" data-w="${w}">${w}</button>`).join("")}</div><div class="actions"><button id="undo" class="secondary">Undo</button><button id="clear" class="secondary">Clear</button><button id="check" class="primary">Check Answer</button></div></div></div>`;document.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{if(locked)return;built.push({w:b.dataset.w,b});b.disabled=true;paint()});$("undo").onclick=()=>{const x=built.pop();if(x)x.b.disabled=false;paint()};$("clear").onclick=()=>{built.forEach(x=>x.b.disabled=false);built=[];paint()};$("check").onclick=()=>{const attempt=built.map(x=>x.w).join(" ").replace(/\s+/g," ").trim();if(attempt===q.answer){locked=true;right()}else{recordMistake(q,attempt||"No answer");$("feedback").textContent="Not yet — change the word order. 💜";$("feedback").className="feedback bad"}}}
function paint(){const a=$("answer");a.innerHTML="";a.classList.toggle("empty",built.length===0);built.forEach((x,n)=>{const s=document.createElement("span");s.className="chip";s.textContent=x.w;s.onclick=()=>{if(locked)return;const r=built.splice(n,1)[0];r.b.disabled=false;paint()};a.appendChild(s)})}
function right(){stars++;if(!questionHadMistake)firstTryCorrect++;$("stars").textContent=`⭐ ${stars}`;$("feedback").textContent="Correct! Great answer! ⭐";$("feedback").className="feedback good";$("flash").classList.add("show");try{const a=$("applause");a.currentTime=0;a.play().catch(()=>{})}catch(e){}setTimeout(()=>{i++;if(i>=qs.length)finish();else render()},850)}
function sendResults(){if(resultsSent)return;resultsSent=true;const total=qs.length;const accuracy=Math.round((firstTryCorrect/total)*100);const params=new URLSearchParams({studentName:student,examId:EXAM_ID,examTitle:EXAM_TITLE,score:String(firstTryCorrect),total:String(total),accuracy:String(accuracy),initialMistakes:String(mistakeLog.length),repairedMistakes:String(mistakeLog.length),mistakeDetails:JSON.stringify(mistakeLog),sectionStats:JSON.stringify({year:"Year 1",trainingMode:true,totalWrongAttempts:wrongAttempts,completedCorrectly:stars})});fetch(RESULTS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:params.toString()}).catch(()=>{});}
function finish(){$("quiz").style.display="none";$("result").style.display="block";$("student").textContent=student;$("final").textContent=`⭐ ${stars} / ${qs.length}`;$("msg").textContent=`First-try score: ${firstTryCorrect} / ${qs.length} • Mistake questions: ${mistakeLog.length}`;sendResults()}
